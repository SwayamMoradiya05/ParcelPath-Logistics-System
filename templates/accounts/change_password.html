{% extends "base/base.html" %}
{% load static %}

{% block title %}
Change Password | ParcelPath
{% endblock %}

{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="card border-0 shadow-lg">

                    <div class="card-body p-5">

                        <h2 class="fw-bold mb-4">

                            Change Password

                        </h2>

                        <form method="post">

                            {% csrf_token %}

                            <div class="mb-3">

                                <label class="form-label">

                                    Current Password

                                </label>

                                <input
                                    type="password"
                                    name="old_password"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">

                                    New Password

                                </label>

                                <input
                                    type="password"
                                    name="new_password1"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="mb-4">

                                <label class="form-label">

                                    Confirm New Password

                                </label>

                                <input
                                    type="password"
                                    name="new_password2"
                                    class="form-control"
                                    required>

                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary">

                                Update Password

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
