{% extends "base/base.html" %}
{% load static %}

{% block title %}
Forgot Password | ParcelPath
{% endblock %}

{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5">

                <div class="card border-0 shadow-lg">

                    <div class="card-body p-5">

                        <div class="text-center mb-4">

                            <h2 class="fw-bold">

                                Forgot Password?

                            </h2>

                            <p class="text-muted">

                                Enter your registered email address.

                            </p>

                        </div>

                        <form method="post">

                            {% csrf_token %}

                            <div class="mb-4">

                                <label class="form-label">

                                    Email Address

                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    required>

                            </div>

                            <button
                                class="btn btn-primary w-100">

                                Send Reset Link

                            </button>

                        </form>

                        <div class="text-center mt-4">

                            <a href="{% url 'accounts:login' %}">

                                Back to Login

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
