{% extends "base/base.html" %}

{% block title %}
Create Route | ParcelPath
{% endblock %}

{% block content %}

<section class="py-4">

<div class="container">

<div class="card border-0 shadow">

<div class="card-header bg-white">

<h3 class="mb-0">

Create Delivery Route

</h3>

</div>

<div class="card-body">

<form method="post">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">

Route Name

</label>

<input
type="text"
name="name"
class="form-control">

</div>

<div class="mb-3">

<label class="form-label">

Assign Driver

</label>

<select
name="driver"
class="form-select">

{% for driver in drivers %}

<option value="{{ driver.id }}">

{{ driver.user.get_full_name }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label class="form-label">

Route Description

</label>

<textarea
rows="4"
name="description"
class="form-control"></textarea>

</div>

<div class="mb-4">

<label class="form-label">

Estimated Distance (km)

</label>

<input
type="number"
step="0.1"
name="distance"
class="form-control">

</div>

<button
class="btn btn-primary">

Create Route

</button>

</form>

</div>

</div>

</div>

</section>

{% endblock %}
