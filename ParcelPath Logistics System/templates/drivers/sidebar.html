
<aside class="pp-side-panel">

    <!-- Driver branding -->
    <div class="pp-side-brand">
        

        <div class="pp-side-brand-text">
            <strong>Driver desk</strong>
            <small>Delivery operations</small>
        </div>
    </div>

    <!-- Today's workspace -->
    <div class="pp-side-label">TODAY</div>

    <nav class="pp-side-nav">

        <a href="{% url 'drivers:dashboard' %}"
           class="{% if request.resolver_match.view_name == 'drivers:dashboard' %}active{% endif %}">
            <span>Overview</span>
        </a>

        <a href="{% url 'drivers:deliveries' %}"
           class="{% if request.resolver_match.view_name == 'drivers:deliveries' %}active{% endif %}">
            <span>Assigned deliveries</span>
        </a>

        <a href="{% url 'drivers:route' %}"
           class="{% if request.resolver_match.view_name == 'drivers:route' %}active{% endif %}">
            <span>Today's route</span>
        </a>

        <a href="{% url 'drivers:history' %}"
           class="{% if request.resolver_match.view_name == 'drivers:history' %}active{% endif %}">
            <span>Delivery history</span>
        </a>

    </nav>

    <!-- Account -->
    <div class="pp-side-label pp-side-account-label">ACCOUNT</div>

    <nav class="pp-side-nav">

        <a href="{% url 'accounts:profile' %}">
            <span>Profile</span>
        </a>

        <a href="{% url 'accounts:logout' %}"
           class="pp-side-danger">
            <span>Logout</span>
        </a>

    </nav>

    <!-- Driver note -->
    <div class="pp-side-note">
        <strong>On the road</strong>

        <p>
            Keep shipment status accurate so customers always
            know what is happening.
        </p>
    </div>

</aside>
